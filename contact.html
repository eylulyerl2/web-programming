<h2>Contact Us</h2>
<p>Fill out the form below to get in touch with us. We are located in Bayrampasa, Istanbul.</p>

<form action="#" method="post">
<fieldset>
<legend>Contact Form</legend>

<label for="name">Name:</label>
<input type="text" id="name" name="name" required><br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required><br><br>

<label for="date">Preferred Date:</label>
<input type="date" id="date" name="date"><br><br>

<label for="subject">Subject:</label>
<select id="subject" name="subject">
<option value="order">Special Order</option>
<option value="repair">Book Repair</option>
<option value="bookclub">Book Club</option>
<option value="other">Other</option>
</select><br><br>

<label for="message">Message:</label><br>
<textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>

<button type="submit">Send</button>
</fieldset>
</form>

</main>
