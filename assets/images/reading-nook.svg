<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Illustration of a reading nook with an armchair, a floor lamp and a stack of books beside a rainy window">
  <defs>
    <linearGradient id="outside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fb3c2"/>
      <stop offset="100%" stop-color="#cbd8dc"/>
    </linearGradient>
    <linearGradient id="lampglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdd9a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffdd9a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#e7dbc8"/>
  <rect y="396" width="800" height="104" fill="#a87c55"/>
  <g stroke="#916a48" stroke-width="3">
    <line x1="0" y1="424" x2="800" y2="424"/>
    <line x1="0" y1="458" x2="800" y2="458"/>
    <line x1="120" y1="396" x2="120" y2="424"/>
    <line x1="420" y1="396" x2="420" y2="424"/>
    <line x1="660" y1="396" x2="660" y2="424"/>
    <line x1="250" y1="424" x2="250" y2="458"/>
    <line x1="560" y1="424" x2="560" y2="458"/>
  </g>

  <!-- window -->
  <rect x="452" y="58" width="286" height="290" rx="6" fill="url(#outside)"/>
  <rect x="452" y="58" width="286" height="290" rx="6" fill="none" stroke="#f4ece0" stroke-width="14"/>
  <line x1="595" y1="58" x2="595" y2="348" stroke="#f4ece0" stroke-width="11"/>
  <line x1="452" y1="203" x2="738" y2="203" stroke="#f4ece0" stroke-width="11"/>
  <g stroke="#7d93a3" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="490" y1="90" x2="478" y2="128"/>
    <line x1="540" y1="110" x2="528" y2="148"/>
    <line x1="640" y1="82" x2="628" y2="120"/>
    <line x1="690" y1="120" x2="678" y2="158"/>
    <line x1="510" y1="240" x2="498" y2="278"/>
    <line x1="620" y1="252" x2="608" y2="290"/>
    <line x1="700" y1="232" x2="688" y2="270"/>
  </g>
  <path d="M452 300 L520 250 L580 300 L640 244 L700 300 L738 272 L738 348 L452 348 Z" fill="#8fa08a" opacity="0.55"/>

  <!-- curtain -->
  <path d="M424 46 L470 46 L470 360 C 450 340 434 320 424 300 Z" fill="#b5563a" opacity="0.9"/>
  <path d="M424 46 L444 46 L444 322 C 436 312 428 304 424 296 Z" fill="#c9694b" opacity="0.8"/>

  <!-- lamp -->
  <path d="M300 96 L400 96 L424 168 L276 168 Z" fill="#d8a34a"/>
  <path d="M276 168 L424 168 L470 396 L230 396 Z" fill="url(#lampglow)"/>
  <rect x="345" y="168" width="10" height="228" fill="#4a4038"/>
  <ellipse cx="350" cy="398" rx="46" ry="12" fill="#4a4038"/>

  <!-- armchair -->
  <path d="M120 236 C 120 196 152 176 200 176 C 248 176 280 196 280 236 L280 330 L120 330 Z" fill="#6b7f5e"/>
  <path d="M146 250 C 146 224 168 210 200 210 C 232 210 254 224 254 250 L254 318 L146 318 Z" fill="#7d9270"/>
  <rect x="104" y="248" width="46" height="96" rx="20" fill="#5d7051"/>
  <rect x="250" y="248" width="46" height="96" rx="20" fill="#5d7051"/>
  <rect x="112" y="320" width="176" height="42" rx="14" fill="#778c6a"/>
  <rect x="128" y="360" width="16" height="38" fill="#6f4f36"/>
  <rect x="256" y="360" width="16" height="38" fill="#6f4f36"/>

  <!-- cushion and open book -->
  <rect x="162" y="222" width="76" height="62" rx="12" fill="#e8d7b6" transform="rotate(-8 200 253)"/>
  <path d="M154 330 L200 316 L246 330 L200 344 Z" fill="#f4ece0"/>
  <path d="M154 330 L200 316 L200 344 Z" fill="#dcd2c0"/>

  <!-- stacked books -->
  <g>
    <rect x="512" y="372" width="150" height="20" rx="4" fill="#b5563a"/>
    <rect x="522" y="352" width="132" height="20" rx="4" fill="#3d4a63"/>
    <rect x="534" y="332" width="112" height="20" rx="4" fill="#d8a34a"/>
    <rect x="546" y="314" width="92" height="18" rx="4" fill="#8a4a38"/>
    <g fill="#f4ece0" opacity="0.65">
      <rect x="518" y="378" width="138" height="4"/>
      <rect x="528" y="358" width="120" height="4"/>
      <rect x="540" y="338" width="100" height="4"/>
    </g>
  </g>

  <!-- mug -->
  <rect x="684" y="356" width="46" height="36" rx="6" fill="#f4ece0"/>
  <path d="M730 364 C 748 364 748 386 730 386" fill="none" stroke="#f4ece0" stroke-width="7"/>
  <path d="M694 350 C 700 340 706 346 712 336" fill="none" stroke="#cbbfae" stroke-width="4" stroke-linecap="round"/>

  <!-- plant -->
  <path d="M46 396 L86 396 L80 344 L52 344 Z" fill="#b5563a"/>
  <g fill="#6b7f5e">
    <path d="M66 344 C 40 318 38 282 62 262 C 76 288 78 322 66 344 Z"/>
    <path d="M66 344 C 94 322 100 288 84 266 C 66 290 60 322 66 344 Z"/>
  </g>
</svg>
